<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flapi Stamp Pattern Mixer (bookmark demo)</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1419; --card:#1a222c; --ink:#e8eef5; --muted:#8b9aab; --accent:#5eead4; --shop:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, "Hiragino Sans", sans-serif; background: radial-gradient(1200px 600px at 20% -10%, #1e3a3a, var(--bg)); color: var(--ink); min-height:100vh; padding:24px; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
  .layout { display:grid; gap:20px; grid-template-columns: 280px 1fr; max-width:980px; }
  @media (max-width:800px){ .layout { grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid #2a3542; border-radius:16px; padding:16px; }
  label { display:block; font-size:.75rem; color:var(--muted); margin:12px 0 6px; }
  select, input[type=range] { width:100%; }
  .row { display:flex; gap:8px; align-items:center; }
  button { background:var(--accent); color:#042f2e; border:0; border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer; }
  button.secondary { background:#334155; color:var(--ink); }
  .card-wrap { display:flex; justify-content:center; align-items:center; min-height:420px; }
  .stamp-card { width:280px; height:400px; border-radius:20px; position:relative; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.45); border:1px solid #334155; }
  .stamp-card .pattern { position:absolute; inset:0; opacity:.55; }
  .stamp-card .veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(15,20,25,.15), rgba(15,20,25,.75)); }
  .stamp-card .content { position:relative; z-index:2; padding:22px; height:100%; display:flex; flex-direction:column; }
  .shop { font-size:.7rem; letter-spacing:.12em; color:var(--shop); font-weight:700; }
  .title { font-size:1.35rem; margin:8px 0 4px; font-weight:800; }
  .meta { font-size:.8rem; color:#cbd5e1; }
  .slots { margin-top:auto; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .slot { aspect-ratio:1; border-radius:999px; border:2px dashed rgba(255,255,255,.35); background:rgba(255,255,255,.06); display:grid; place-items:center; font-size:.7rem; color:#94a3b8; }
  .slot.filled { border-style:solid; border-color:var(--accent); background:rgba(94,234,212,.2); color:var(--accent); font-weight:700; }
  .hint { margin-top:14px; font-size:.8rem; color:var(--muted); line-height:1.5; }
  code { font-size:.78rem; background:#0b1220; padding:2px 6px; border-radius:6px; }
</style>
</head>
<body>
  <h1>Flapi向け スタンプカード柄ミキサー</h1>
  <p class="sub">今日のブックマーク（@nyanneco9 のSVG柄ジェネレーター）を、店舗スタンプUIに落とす最小デモ。箱ローカルのみ。</p>
  <div class="layout">
    <div class="panel">
      <label>ベース柄</label>
      <select id="base">
        <option value="dots">ドット</option>
        <option value="stripes">ストライプ</option>
        <option value="hex">ヘキサ</option>
        <option value="waves">ウェーブ</option>
        <option value="checks">チェック</option>
      </select>
      <label>重ね柄</label>
      <select id="overlay">
        <option value="none">なし</option>
        <option value="dots">ドット</option>
        <option value="stripes">ストライプ</option>
        <option value="hex">ヘキサ</option>
        <option value="waves">ウェーブ</option>
        <option value="stars">スター</option>
      </select>
      <label>色A <span id="c1v"></span></label>
      <input type="color" id="c1" value="#0d9488" />
      <label>色B <span id="c2v"></span></label>
      <input type="color" id="c2" value="#fbbf24" />
      <label>密度 <span id="densv">3</span></label>
      <input type="range" id="dens" min="1" max="6" value="3" />
      <label>獲得スタンプ数 <span id="gotv">3</span></label>
      <input type="range" id="got" min="0" max="10" value="3" />
      <div class="row" style="margin-top:16px">
        <button type="button" id="rand">ランダム</button>
        <button type="button" class="secondary" id="export">SVGコピー</button>
      </div>
      <p class="hint">開き方: この <code>index.html</code> をブラウザで開く。Flapi店舗カードの背景柄バリエーション検証用。</p>
    </div>
    <div class="panel card-wrap">
      <div class="stamp-card" id="card">
        <div class="pattern" id="pattern"></div>
        <div class="veil"></div>
        <div class="content">
          <div class="shop">NEARBY STORE</div>
          <div class="title">カフェ・ベル</div>
          <div class="meta">来店スタンプ · 10個で1杯無料</div>
          <div class="slots" id="slots"></div>
        </div>
      </div>
    </div>
  </div>
<script>
const patterns = {
  dots: (c1,c2,d) => {
    const s = 28/d; return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><pattern id="p" width="${s}" height="${s}" patternUnits="userSpaceOnUse"><circle cx="${s/2}" cy="${s/2}" r="${s*0.18}" fill="${c2}"/></pattern></defs><rect width="100%" height="100%" fill="${c1}"/><rect width="100%" height="100%" fill="url(#p)"/></svg>`;
  },
  stripes: (c1,c2,d) => {
    const s = 22/d*2; return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><pattern id="p" width="${s}" height="${s}" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="${s/2}" height="${s}" fill="${c2}"/></pattern></defs><rect width="100%" height="100%" fill="${c1}"/><rect width="100%" height="100%" fill="url(#p)" opacity=".55"/></svg>`;
  },
  hex: (c1,c2,d) => {
    const s = 36/d*1.5; return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><pattern id="p" width="${s*1.5}" height="${s*1.732}" patternUnits="userSpaceOnUse"><polygon points="${s*0.75},0 ${s*1.5},${s*0.433} ${s*1.5},${s*1.299} ${s*0.75},${s*1.732} 0,${s*1.299} 0,${s*0.433}" fill="none" stroke="${c2}" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="${c1}"/><rect width="100%" height="100%" fill="url(#p)"/></svg>`;
  },
  waves: (c1,c2,d) => {
    const s = 40/d*2; return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><pattern id="p" width="${s}" height="${s}" patternUnits="userSpaceOnUse"><path d="M0 ${s/2} Q ${s/4} 0 ${s/2} ${s/2} T ${s} ${s/2}" fill="none" stroke="${c2}" stroke-width="2"/></pattern></defs><rect width="100%" height="100%" fill="${c1}"/><rect width="100%" height="100%" fill="url(#p)"/></svg>`;
  },
  checks: (c1,c2,d) => {
    const s = 24/d*2; return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><pattern id="p" width="${s}" height="${s}" patternUnits="userSpaceOnUse"><rect width="${s/2}" height="${s/2}" fill="${c2}"/><rect x="${s/2}" y="${s/2}" width="${s/2}" height="${s/2}" fill="${c2}"/></pattern></defs><rect width="100%" height="100%" fill="${c1}"/><rect width="100%" height="100%" fill="url(#p)" opacity=".35"/></svg>`;
  },
  stars: (c1,c2,d) => {
    const s = 32/d*1.8; return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><pattern id="p" width="${s}" height="${s}" patternUnits="userSpaceOnUse"><polygon points="${s/2},${s*0.15} ${s*0.58},${s*0.4} ${s*0.85},${s*0.4} ${s*0.63},${s*0.57} ${s*0.72},${s*0.82} ${s/2},${s*0.68} ${s*0.28},${s*0.82} ${s*0.37},${s*0.57} ${s*0.15},${s*0.4} ${s*0.42},${s*0.4}" fill="${c2}"/></pattern></defs><rect width="100%" height="100%" fill="transparent"/><rect width="100%" height="100%" fill="url(#p)" opacity=".5"/></svg>`;
  },
  none: () => ''
};
function render(){
  const base = baseEl.value, overlay = overlayEl.value;
  const c1 = c1El.value, c2 = c2El.value, d = +densEl.value, got = +gotEl.value;
  densv.textContent = d; gotv.textContent = got; c1v.textContent = c1; c2v.textContent = c2;
  const a = patterns[base](c1,c2,d);
  const b = overlay==='none' ? '' : patterns[overlay](c1,c2,d).replace(/id="p"/g,'id="o"').replace(/url\(#p\)/g,'url(#o)');
  // merge: overlay SVG as absolute second layer via data URI stacking
  pattern.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;inset:0';
  const img1 = document.createElement('div');
  img1.style.cssText = 'position:absolute;inset:0';
  img1.innerHTML = a;
  wrap.appendChild(img1);
  if (b) {
    const img2 = document.createElement('div');
    img2.style.cssText = 'position:absolute;inset:0;opacity:.65;mix-blend-mode:soft-light';
    img2.innerHTML = b;
    wrap.appendChild(img2);
  }
  pattern.appendChild(wrap);
  slots.innerHTML = '';
  for (let i=0;i<10;i++){
    const s = document.createElement('div');
    s.className = 'slot' + (i<got?' filled':'');
    s.textContent = i<got ? '✓' : (i+1);
    slots.appendChild(s);
  }
  lastSvg = a; // export base
}
let lastSvg = '';
const baseEl = document.getElementById('base');
const overlayEl = document.getElementById('overlay');
const c1El = document.getElementById('c1');
const c2El = document.getElementById('c2');
const densEl = document.getElementById('dens');
const gotEl = document.getElementById('got');
const densv = document.getElementById('densv');
const gotv = document.getElementById('gotv');
const c1v = document.getElementById('c1v');
const c2v = document.getElementById('c2v');
const pattern = document.getElementById('pattern');
const slots = document.getElementById('slots');
['change','input'].forEach(ev => [baseEl,overlayEl,c1El,c2El,densEl,gotEl].forEach(el => el.addEventListener(ev, render)));
document.getElementById('rand').onclick = () => {
  const keys = Object.keys(patterns).filter(k=>k!=='none'&&k!=='stars');
  baseEl.value = keys[Math.floor(Math.random()*keys.length)];
  const overs = ['none',...keys,'stars'];
  overlayEl.value = overs[Math.floor(Math.random()*overs.length)];
  c1El.value = '#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
  c2El.value = '#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
  densEl.value = 1+Math.floor(Math.random()*6);
  gotEl.value = Math.floor(Math.random()*11);
  render();
};
document.getElementById('export').onclick = async () => {
  try { await navigator.clipboard.writeText(lastSvg); alert('ベースSVGをコピーしました'); }
  catch { prompt('コピー:', lastSvg); }
};
render();
</script>
</body>
</html>
