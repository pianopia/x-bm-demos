<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flapi-ish vector stamp card (demo)</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --ink: #f4f7fb;
    --muted: #9aa7b8;
    --accent: #3dd6c6;
    --stamp: #ff6b4a;
    --slot: #2a3548;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1e3a4a, var(--bg));
    color: var(--ink);
    display: grid; place-items: center; padding: 24px;
  }
  .wrap { width: min(420px, 100%); }
  h1 { font-size: 1.05rem; font-weight: 650; margin: 0 0 6px; }
  p.note { margin: 0 0 16px; color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
  .card {
    background: linear-gradient(160deg, #223049, var(--card));
    border: 1px solid #314058;
    border-radius: 18px;
    padding: 20px 18px 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,.35);
  }
  .shop {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: #12202e; display: grid; place-items: center;
    border: 1px solid #3a4f6a;
  }
  .shop strong { display: block; font-size: 1rem; }
  .shop span { color: var(--muted); font-size: 0.78rem; }
  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    margin: 12px 0 14px;
  }
  .slot {
    aspect-ratio: 1; border-radius: 12px;
    background: var(--slot);
    border: 1.5px dashed #40536d;
    display: grid; place-items: center;
    transition: transform .15s ease, border-color .15s;
  }
  .slot.filled {
    border-style: solid; border-color: color-mix(in oklab, var(--stamp) 55%, #40536d);
    background: #243146;
  }
  .slot.filled:hover { transform: scale(1.04); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    appearance: none; border: 0; border-radius: 999px;
    padding: 10px 14px; font-weight: 650; cursor: pointer;
    background: var(--accent); 
    color: #062a28;
  }
  button.ghost {
    background: transparent; color: var(--ink);
    border: 1px solid #3d516c;
  }
  .meta { margin-top: 12px; font-size: 0.78rem; color: var(--muted); }
  .scale {
    margin-top: 18px; padding: 12px; border-radius: 14px;
    background: #121a24; border: 1px solid #2c3b50;
  }
  .scale label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 8px; }
  input[type=range] { width: 100%; }
  .zoom-preview {
    margin-top: 10px; height: 72px; display: flex; align-items: center; justify-content: center;
    overflow: hidden; border-radius: 10px; background: #0c1219;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>ベクタースタンプカード（軽量デモ）</h1>
    <p class="note">80 Levelの無料リアルタイム・ベクターGFX投稿を受けて、Flapi店舗スタンプをSVGで置くと拡大してもジャギらないことを体感するプロトタイプ。本番ライブラリではない。</p>
    <div class="card">
      <div class="shop">
        <div class="logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28">
            <circle cx="14" cy="14" r="12" fill="#3dd6c6"/>
            <path d="M8 16c2.2-4 4.4-6 6-6s3.8 2 6 6" stroke="#062a28" stroke-width="2" fill="none" stroke-linecap="round"/>
            <circle cx="14" cy="11" r="2.2" fill="#062a28"/>
          </svg>
        </div>
        <div>
          <strong>カフェ・ピアノピア</strong>
          <span>来店スタンプ · 10個で1杯無料</span>
        </div>
      </div>
      <div class="grid" id="slots"></div>
      <div class="row">
        <button id="stamp">スタンプを押す</button>
        <button class="ghost" id="reset">リセット</button>
      </div>
      <div class="meta" id="status">0 / 10 · ベクターなので拡大しても輪郭が割れない</div>
    </div>
    <div class="scale">
      <label for="zoom">プレビュー拡大（ラスターならここでジャギる）: <span id="zoomVal">1.0×</span></label>
      <input id="zoom" type="range" min="1" max="6" step="0.1" value="1" />
      <div class="zoom-preview">
        <svg id="zoomStamp" width="40" height="40" viewBox="0 0 40 40" style="transform:scale(1)">
          <defs>
            <filter id="press">
              <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-opacity=".35"/>
            </filter>
          </defs>
          <circle cx="20" cy="20" r="17" fill="#ff6b4a" filter="url(#press)"/>
          <path d="M12 21.5l5 5 11-12" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>
<script>
const TOTAL = 10;
const slots = document.getElementById('slots');
const status = document.getElementById('status');
let count = Number(localStorage.getItem('flapi-vector-stamps') || 0);

function stampSVG() {
  return `<svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="17" fill="#ff6b4a"/>
    <path d="M12 21.5l5 5 11-12" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function render() {
  slots.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'slot' + (i < count ? ' filled' : '');
    if (i < count) d.innerHTML = stampSVG();
    slots.appendChild(d);
  }
  const left = TOTAL - count;
  status.textContent = left > 0
    ? `${count} / ${TOTAL} · あと${left}で特典`
    : `${count} / ${TOTAL} · 特典解除！（デモ）`;
  localStorage.setItem('flapi-vector-stamps', String(count));
}

document.getElementById('stamp').onclick = () => {
  if (count < TOTAL) count += 1;
  render();
};
document.getElementById('reset').onclick = () => { count = 0; render(); };

const zoom = document.getElementById('zoom');
const zoomStamp = document.getElementById('zoomStamp');
const zoomVal = document.getElementById('zoomVal');
zoom.oninput = () => {
  const v = Number(zoom.value);
  zoomStamp.style.transform = `scale(${v})`;
  zoomVal.textContent = v.toFixed(1) + '×';
};
render();
</script>
</body>
</html>
