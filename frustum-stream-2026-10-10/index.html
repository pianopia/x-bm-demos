<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frustum Streaming toy</title>
<style>body{margin:0;background:#0d1117;color:#dde;font:14px system-ui,sans-serif}#ui{position:fixed;left:10px;top:10px;background:#0009;padding:10px 12px;border-radius:8px;max-width:330px;line-height:1.5}
canvas{display:block;width:100vw;height:100vh;touch-action:none}label{display:block}b{color:#ffd479}small{color:#99a}</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><b>Frustum Streaming toy</b><br><small>Roblox Frustum Streaming 着想。BELENUS / cloud-stream の「狭いゾーン＋遠景だけ伸ばす」感触用（本物のエンジンではない）。ドラッグ=視線回転、WASD/矢印=移動。</small>
<label><input type="radio" name="m" value="cube"> 周囲を均等（立方体半径）</label>
<label><input type="radio" name="m" value="frustum" checked> 視錐台だけ遠くまで＋足元は近距離</label>
<label>近距離半径 <input id="near" type="range" min="1" max="6" value="2"> </label>
<label>遠距離（視錐台） <input id="far" type="range" min="4" max="30" value="18"></label>
<label>FOV <input id="fov" type="range" min="30" max="120" value="70"></label>
<div id="stat"></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H;function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}rs();onresize=rs;
const N=64;let px=32,py=32,ang=-0.6;const loaded=new Map();let budgetMs=0;
const $=id=>document.getElementById(id);const keys={};onkeydown=e=>keys[e.key]=1;onkeyup=e=>keys[e.key]=0;
let drag=null;c.onpointerdown=e=>drag=e.clientX;onpointerup=()=>drag=null;onpointermove=e=>{if(drag!=null){ang+=(e.clientX-drag)*0.01;drag=e.clientX}};
function want(x,y,mode,near,far,fov){const dx=x+.5-px,dy=y+.5-py,d=Math.hypot(dx,dy);
 if(mode==='cube')return Math.max(Math.abs(dx),Math.abs(dy))<=far*0.55;
 if(d<=near)return true;if(d>far)return false;let a=Math.atan2(dy,dx)-ang;a=Math.atan2(Math.sin(a),Math.cos(a));return Math.abs(a)<=fov/2+0.5/d}
function step(){const sp=0.12,f=(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0),s=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);
 px=Math.min(N-1,Math.max(1,px+Math.cos(ang)*f*sp-Math.sin(ang)*s*sp));py=Math.min(N-1,Math.max(1,py+Math.sin(ang)*f*sp+Math.cos(ang)*s*sp));
 const mode=document.querySelector('[name=m]:checked').value,near=+$('near').value,far=+$('far').value,fov=$('fov').value*Math.PI/180;
 let req=0,newly=0;const now=performance.now();
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const k=y*N+x;if(want(x,y,mode,near,far,fov)){req++;if(!loaded.has(k)){if(newly<12){loaded.set(k,now);newly++}}else loaded.set(k,Math.max(loaded.get(k),now-400))}else if(loaded.has(k)&&now-loaded.get(k)>1500)loaded.delete(k)}
 const cs=Math.min(W,H)/N,ox=(W-cs*N)/2,oy=(H-cs*N)/2;g.fillStyle='#0d1117';g.fillRect(0,0,W,H);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const k=y*N+x,h=(Math.sin(x*.3)+Math.cos(y*.25+x*.1))*.5;
  if(loaded.has(k)){const age=Math.min(1,(now-loaded.get(k))/300);g.fillStyle=`hsla(${110+h*40},45%,${28+h*12}%,${.35+.65*age})`}else g.fillStyle='#161b22';g.fillRect(ox+x*cs,oy+y*cs,cs-1,cs-1)}
 g.strokeStyle='#ffd47999';g.lineWidth=2*devicePixelRatio;g.beginPath();g.moveTo(ox+px*cs,oy+py*cs);
 if(mode==='frustum'){g.lineTo(ox+(px+Math.cos(ang-fov/2)*far)*cs,oy+(py+Math.sin(ang-fov/2)*far)*cs);g.moveTo(ox+px*cs,oy+py*cs);g.lineTo(ox+(px+Math.cos(ang+fov/2)*far)*cs,oy+(py+Math.sin(ang+fov/2)*far)*cs);g.stroke();g.beginPath();g.arc(ox+px*cs,oy+py*cs,near*cs,0,7)}
 g.stroke();g.fillStyle='#ffd479';g.beginPath();g.arc(ox+px*cs,oy+py*cs,cs*.6,0,7);g.fill();
 $('stat').innerHTML=`ロード中チャンク: <b>${loaded.size}</b> / 要求 ${req}<br><small>同じ「遠距離」で両モードを切り替えて数を比較。1フレーム最大12チャンクだけ追加ロード（ストリーム予算）。</small>`;
 requestAnimationFrame(step)}step();
</script></body></html>
