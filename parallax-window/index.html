<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parallax Window — BELENUS-ish 30min demo</title>
<style>
  :root {
    --frame: #2a2118;
    --sill: #5c4634;
    --glass: rgba(180, 210, 230, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 20%, #3a322c, #151210 70%);
    color: #f3ebe2;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  .wrap { width: min(920px, 94vw); }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 .35rem; letter-spacing: .02em; }
  p.meta { margin: 0 0 1rem; opacity: .7; font-size: .85rem; }
  .room {
    position: relative;
    aspect-ratio: 16 / 10;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(#4a3b30, #2b221c);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.06);
  }
  .wall-tex {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 48px),
      linear-gradient(180deg, #5a4638, #3a2e26);
    opacity: .9;
  }
  .window-frame {
    position: absolute;
    left: 12%; right: 12%; top: 10%; bottom: 22%;
    border: 14px solid var(--frame);
    border-radius: 6px;
    box-shadow:
      inset 0 0 0 3px #1a140f,
      0 8px 24px rgba(0,0,0,.35);
    overflow: hidden;
    background: #87a0b8;
  }
  .mullion-v, .mullion-h {
    position: absolute; background: var(--frame); z-index: 5; pointer-events: none;
  }
  .mullion-v { left: 50%; top: 0; bottom: 0; width: 10px; transform: translateX(-50%); }
  .mullion-h { top: 50%; left: 0; right: 0; height: 10px; transform: translateY(-50%); }
  .scene {
    position: absolute; inset: -8%;
    will-change: transform;
  }
  .layer {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
  }
  /* Far: soft sky + distant hills */
  .far {
    background:
      radial-gradient(ellipse 80% 50% at 50% 18%, #fff6d8 0%, transparent 55%),
      linear-gradient(180deg, #6ea0c8 0%, #9ec4e0 42%, #c5d9a8 42%, #8fad6e 100%);
  }
  .far::after {
    content: "";
    position: absolute; left: -5%; right: -5%; bottom: 28%;
    height: 28%;
    background:
      radial-gradient(ellipse 40% 100% at 20% 100%, #6d8a5a 0 60%, transparent 61%),
      radial-gradient(ellipse 45% 110% at 55% 100%, #7a9664 0 55%, transparent 56%),
      radial-gradient(ellipse 35% 90% at 85% 100%, #658055 0 60%, transparent 61%);
    opacity: .85;
  }
  /* Mid: trees / building silhouettes */
  .mid {
    background:
      linear-gradient(180deg, transparent 45%, rgba(40,55,35,.15) 100%);
  }
  .mid::before, .mid::after {
    content: "";
    position: absolute; bottom: 18%;
    width: 22%; height: 42%;
    background: linear-gradient(180deg, #2f3d2a, #1c2618);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    filter: blur(.3px);
  }
  .mid::before { left: 8%; transform: scale(1.1); opacity: .9; }
  .mid::after { right: 12%; width: 28%; height: 48%; opacity: .95; }
  .mid .ridge {
    position: absolute; left: 0; right: 0; bottom: 16%;
    height: 22%;
    background:
      repeating-linear-gradient(90deg,
        #24301f 0 18px, #1a2416 18px 28px, #2c3a24 28px 40px);
    clip-path: polygon(0 40%, 8% 20%, 16% 45%, 28% 10%, 40% 38%, 52% 5%, 64% 42%, 76% 12%, 88% 35%, 100% 18%, 100% 100%, 0 100%);
    opacity: .92;
  }
  /* Near: window ledge plants / curtain hint */
  .near .plant {
    position: absolute; bottom: 8%; width: 16%; height: 38%;
    background: radial-gradient(ellipse at 50% 80%, #1e3a1a 20%, #3d6b32 55%, transparent 70%);
    filter: blur(.2px);
  }
  .near .plant.l { left: 2%; }
  .near .plant.r { right: 3%; width: 18%; height: 42%; }
  .near .curtain {
    position: absolute; top: 0; width: 14%; height: 100%;
    background: linear-gradient(90deg, rgba(90,40,40,.55), rgba(90,40,40,.08));
  }
  .near .curtain.l { left: 0; }
  .near .curtain.r { right: 0; transform: scaleX(-1); }
  .glass {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background:
      linear-gradient(135deg, rgba(255,255,255,.22) 0%, transparent 28%, transparent 72%, rgba(255,255,255,.08) 100%),
      var(--glass);
  }
  .sill {
    position: absolute; left: 10%; right: 10%; bottom: 14%;
    height: 7%;
    background: linear-gradient(#7a5c44, var(--sill));
    border-radius: 2px;
    box-shadow: 0 6px 12px rgba(0,0,0,.3);
    z-index: 6;
  }
  .hint {
    margin-top: .85rem;
    font-size: .8rem;
    opacity: .65;
  }
  code { font-size: .78rem; background: rgba(255,255,255,.08); padding: .1rem .35rem; border-radius: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>窓外の視差（近・中・遠）— 30分プロト</h1>
    <p class="meta">inspired by @CST_negi Astra parallax Mapping · BELENUS向け奥行き感のたたき台</p>
    <div class="room" id="room">
      <div class="wall-tex"></div>
      <div class="window-frame" id="window">
        <div class="scene" id="scene">
          <div class="layer far" data-depth="0.15"></div>
          <div class="layer mid" data-depth="0.4"><div class="ridge"></div></div>
          <div class="layer near" data-depth="0.75">
            <div class="curtain l"></div>
            <div class="curtain r"></div>
            <div class="plant l"></div>
            <div class="plant r"></div>
          </div>
        </div>
        <div class="glass"></div>
        <div class="mullion-v"></div>
        <div class="mullion-h"></div>
      </div>
      <div class="sill"></div>
    </div>
    <p class="hint">マウスを窓の上で動かすとレイヤーがずれる。深さは <code>data-depth</code> で調整。</p>
  </div>
<script>
(() => {
  const win = document.getElementById('window');
  const layers = [...document.querySelectorAll('.layer')];
  let tx = 0, ty = 0, cx = 0, cy = 0;
  win.addEventListener('pointermove', (e) => {
    const r = win.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
    ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
  });
  win.addEventListener('pointerleave', () => { tx = 0; ty = 0; });
  function tick() {
    cx += (tx - cx) * 0.08;
    cy += (ty - cy) * 0.08;
    for (const el of layers) {
      const d = parseFloat(el.dataset.depth || '0.3');
      const x = (-cx * 28 * d).toFixed(2);
      const y = (-cy * 18 * d).toFixed(2);
      el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 + d * 0.04})`;
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
