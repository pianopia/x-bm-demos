<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flapi × OpenPOI すれちがいスポット</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,"Hiragino Sans",sans-serif;background:#0f1216;color:#e8e6e1}
#map{position:fixed;inset:0}
#ui{position:fixed;z-index:1000;left:10px;top:10px;width:min(340px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto;background:#14181ee8;border:1px solid #2a3038;border-radius:12px;padding:12px;backdrop-filter:blur(6px)}
h1{font-size:15px;margin:0 0 4px}small{color:#9aa3ad;line-height:1.5;display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button,select{font:inherit;color:#e8e6e1;background:#222831;border:1px solid #39414c;border-radius:999px;padding:4px 10px;cursor:pointer}
button.on{background:#ffcf5a;color:#1a1400;border-color:#ffcf5a}
label{display:block;margin:6px 0}input[type=range]{width:100%}
#stat{margin:6px 0;color:#cfd6dd}#list{margin-top:6px}
.it{padding:6px 8px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.it:hover{background:#222831}
.sc{font-variant-numeric:tabular-nums;color:#ffcf5a;white-space:nowrap}
#card{display:none;margin-top:10px;border-radius:12px;padding:12px;background:linear-gradient(135deg,#fdf6e7,#efe2c4);color:#2b2216;position:relative;overflow:hidden}
#card .nm{font-weight:700;font-size:16px}#card .stamp{position:absolute;right:10px;top:10px;width:74px;height:74px;border:3px solid #c0392b;border-radius:50%;color:#c0392b;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:700;transform:rotate(-12deg);line-height:1.2;padding:4px}
#card .sp{margin-top:8px;font-size:12px}#card .lic{margin-top:6px;font-size:10px;color:#6b5a40}
a{color:#7cc4ff}.dk{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.4)}.leaflet-container{background:#1a1f26}
</style></head><body>
<div id="map"></div>
<div id="ui">
<h1>Flapi × OpenPOI すれちがいスポット</h1>
<small>X ブックマーク「OpenPOI API」（@naogify、全国約300万件・キー不要・CORS可）着想。今いる場所の周りの<b>実在の施設</b>を引いて、名刺交換しやすそうな「すれちがいスポット」を並べるトイ。スコアは仮のヒューリスティックで、Flapi本体とは無関係。地図をタップすると中心を移動。</small>
<div class="row" id="areas"></div>
<label>半径 <span id="rv">300</span>m <input id="r" type="range" min="100" max="1000" step="50" value="300"></label>
<div class="row" id="cats"></div>
<div id="stat">読み込み中…</div>
<div id="card"><div class="stamp" id="stamp"></div><div class="nm">Shota / pianopia</div><div style="font-size:12px">Flapi · tategaki · BELENUS</div><div class="sp" id="sp"></div><div class="lic" id="lic"></div></div>
<div id="list"></div>
<small style="margin-top:8px">出典: <a href="https://openpoiapi.com/attribution.html" target="_blank" rel="noopener">OpenPOI API</a> ／ 地図 © OpenStreetMap contributors</small>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const AREAS={"下北沢":[35.6616,139.6684],"渋谷":[35.6580,139.7016],"池尻大橋":[35.6505,139.6843],"高円寺":[35.7053,139.6497],"京都 河原町":[35.0037,135.7690]};
// 交換しやすさの仮重み（座って話せる・人が集まる場所ほど高い）
const W={cafe:1,bar_izakaya:.9,tourism:.85,bakery:.6,restaurant:.65,fast_food:.45,retail_other:.5,lodging:.4,station:.7,public_facility:.55,education:.35,service_other:.3,grocery:.2,convenience_store:.25,finance:.1,medical:.05,unknown:.2};
const JA={cafe:"カフェ",bar_izakaya:"バー/居酒屋",tourism:"劇場・観光",bakery:"パン",restaurant:"飲食",fast_food:"ファスト",retail_other:"店舗",lodging:"宿",station:"駅",public_facility:"公共",education:"教育",service_other:"サービス",grocery:"食料品",convenience_store:"コンビニ",finance:"金融",medical:"医療",unknown:"不明"};
const CATS=["cafe","bar_izakaya","tourism","restaurant","retail_other","station"];
let center=AREAS["下北沢"],radius=300,on=new Set(["cafe","bar_izakaya","tourism"]),data=[],layer,circle,seq=0;
const $=id=>document.getElementById(id);const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=L.map('map',{zoomControl:false}).setView(center,17);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:'dk',attribution:'© OpenStreetMap contributors'}).addTo(map);
layer=L.layerGroup().addTo(map);
for(const a in AREAS){const b=document.createElement('button');b.textContent=a;b.onclick=()=>{center=AREAS[a];map.setView(center,radius>600?15:17);load()};$('areas').append(b)}
for(const c of CATS){const b=document.createElement('button');b.textContent=JA[c];b.className=on.has(c)?'on':'';b.onclick=()=>{on.has(c)?on.delete(c):on.add(c);b.className=on.has(c)?'on':'';render()};$('cats').append(b)}
$('r').oninput=e=>{radius=+e.target.value;$('rv').textContent=radius};$('r').onchange=load;
map.on('click',e=>{center=[e.latlng.lat,e.latlng.lng];load()});
function dist(a,b){const R=6371e3,t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t;const h=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
async function load(){const my=++seq;$('stat').textContent='OpenPOI に問い合わせ中…';
 const u=`https://api.openpoiapi.com/v1/search?center=${center[1].toFixed(6)},${center[0].toFixed(6)}&radius=${radius}&limit=200`;
 try{const t0=performance.now();const r=await fetch(u);const j=await r.json();if(my!==seq)return;
  const ms=Math.round(performance.now()-t0);
  // 同じ座標に積み重なる店（同じ建物）をまとめて「人の集まり度」に使う
  const stack={};for(const p of j.results){if(p.lat===''||p.lng==='')continue;const k=(+p.lat).toFixed(4)+','+(+p.lng).toFixed(4);stack[k]=(stack[k]||0)+1}
  data=j.results.filter(p=>p.lat!==''&&p.lng!=='').map(p=>{const ll=[+p.lat,+p.lng],d=dist(center,ll),k=ll[0].toFixed(4)+','+ll[1].toFixed(4);
   const s=(W[p.category]??.2)*0.6+Math.min(1,(stack[k]-1)/6)*0.2+(1-d/radius)*0.2;return{...p,ll,d,s:Math.round(s*100)}});
  $('stat').innerHTML=`周辺 <b>${data.length}</b> 件（${ms}ms・API実呼び出し${data.length>=200?'・近い順に上限200件':''}）`;render()}catch(e){if(my===seq)$('stat').textContent='取得失敗: '+e.message}}
function render(){layer.clearLayers();if(circle)map.removeLayer(circle);
 circle=L.circle(center,{radius,color:'#ffcf5a',weight:1,fillOpacity:.04}).addTo(map);
 const v=data.filter(p=>on.has(p.category)).sort((a,b)=>b.s-a.s);
 for(const p of data){const hit=on.has(p.category);const m=L.circleMarker(p.ll,{radius:hit?4+p.s/14:2.5,color:hit?`hsl(${40-p.s*.3},95%,60%)`:'#4a525c',weight:1,fillOpacity:hit?.75:.4}).addTo(layer);
  m.bindTooltip(`${esc(p.name)}<br>${JA[p.category]||p.category}${hit?' · '+p.s:''}`);m.on('click',ev=>{L.DomEvent.stopPropagation(ev);pick(p)})}
 const top=v.slice(0,12);$('list').innerHTML='';
 if(!top.length){$('list').innerHTML='<small>このカテゴリは周辺に無し。チップを足すか半径を広げて。</small>';return}
 top.forEach((p,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=`<span>${i+1}. ${esc(p.name)}<br><small>${JA[p.category]} · ${Math.round(p.d)}m</small></span><span class="sc">${p.s}</span>`;d.onclick=()=>{map.panTo(p.ll);pick(p)};$('list').append(d)})}
function pick(p){$('card').style.display='block';$('stamp').textContent=p.name.slice(0,14);
 $('sp').innerHTML=`📍 <b>${esc(p.name)}</b> で交換（${JA[p.category]}・中心から${Math.round(p.d)}m）<br>${esc(p.address)}`;
 $('lic').textContent='source: '+p.source+' / '+(p.licenses||[]).join(', ')}
load();
</script></body></html>
