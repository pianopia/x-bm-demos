<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PS1 Moon Push — 月面すもう</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./ui.css">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
</head>
<body class="title">
<div id="hud" class="panel">
  <div class="px"><b>MOON PUSH</b> <span class="tag">PS1 × StarFight</span></div>
  <div class="row">
    <span id="timer">1:30</span>
    <span id="alive">生存 —</span>
    <span id="deaths">落下 0</span>
  </div>
  <div id="status">読込中…</div>
</div>
<div id="topR">
  <button id="sndBtn" type="button" title="BGM/効果音">♪ ON</button>
  <a href="../"><button>一覧</button></a>
</div>
<div id="banner" class="panel px"></div>
<div id="lobby" class="panel"><span id="lobbyText">ロビー</span> <small id="lobbySub"></small></div>
<div id="result" class="panel"><div class="box panel">
  <h2 class="px">RESULT</h2>
  <ul id="scoreList"></ul>
  <button id="retryBtn">もう一度</button>
</div></div>
<div id="title">
  <div id="titleBar" class="panel">
    <span class="px logo">月面 PUSH</span>
    <label class="nameLbl">名前<input id="nameIn" maxlength="16" placeholder="Astro"></label>
    <button id="playBtn" type="button">キューに入る</button>
    <button id="helpBtn" type="button" title="ヘルプ">?</button>
  </div>
  <details id="titleHelp" class="panel">
    <summary>操作・マッチ</summary>
    <p><kbd>WASD</kbd> カメラ基準移動　<kbd>Space</kbd> 押し　<kbd>M</kbd> ミュート。4人マッチ、12秒でNPC補充。WS: <code>wss://realtime.eden14.com/moonpush</code></p>
  </details>
</div>
<div id="touch">
  <div id="joy"><div id="joyK"></div></div>
  <div id="tbtn"><button id="pushBtn">押</button></div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
