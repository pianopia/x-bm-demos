<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS1 Radiance Lite (three.js)</title>
<style>body{margin:0;overflow:hidden;background:#000;font:13px system-ui,"Hiragino Sans",sans-serif}
#ui{position:fixed;left:10px;top:10px;width:min(330px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto;background:#101216e0;color:#e9e4da;padding:10px 12px;border-radius:10px;line-height:1.5}
b{color:#8fe3c0}small{color:#a8b0b8;display:block}a{color:#9cc8ff}label{display:block;margin-top:4px}input[type=range]{width:100%}
button{font:inherit;margin:6px 6px 0 0;padding:3px 10px;border-radius:999px;border:1px solid #556;background:#26303a;color:#eee;cursor:pointer}button.on{background:#8fe3c0;color:#122}
#stat{margin-top:6px;font-variant-numeric:tabular-nums;color:#cfd6dc}canvas{display:block;touch-action:none}
#tagL,#tagR{position:fixed;bottom:12px;color:#fff;background:#0009;padding:2px 8px;border-radius:6px;font-size:12px;display:none}#tagL{left:12px}#tagR{right:12px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script></head><body>
<div id="ui"><b>PS1 Radiance Lite</b>
<small>X ブックマーク <a href="https://x.com/codetaur/status/2114482452798574633" target="_blank">@codetaur</a> の「Radiance Cascades × PS1風レンダリング（WebGPU）」着想。こちらは WebGL の軽量版で、<b>GIはフェイク</b>：ライトから光線を飛ばして当たった面に仮想点光源（VPL）を置く1バウンスだけ（遮蔽なし）。本物の Radiance Cascades ではない。BELENUS のスタイライズド lookdev 用に「ローファイ質感＋柔らかい回り込み」の比較用。ドラッグで視点。</small>
<button data-m="clean">クリーン</button><button data-m="ps1">PS1</button><button data-m="ps1b" class="on">PS1＋バウンス</button><button data-m="ab">A/B 比較</button>
<label>内部解像度（縦） <span id="rv">240</span>px <input id="res" type="range" min="120" max="480" step="8" value="240"></label>
<label>頂点スナップ <span id="sv">160</span> <input id="snap" type="range" min="40" max="480" step="8" value="160"></label>
<label>バウンス強度 <span id="bv">1.0</span> <input id="bounce" type="range" min="0" max="3" step="0.1" value="1"></label>
<label>A/B 境界 <input id="split" type="range" min="0.05" max="0.95" step="0.01" value="0.5"></label>
<label><input id="aff" type="checkbox" checked> アフィンUV（テクスチャのゆがみ）</label>
<label><input id="dith" type="checkbox" checked> ディザ＋15bitカラー</label>
<label><input id="gour" type="checkbox" checked> 頂点ライティング（グーロー）</label>
<label><input id="showv" type="checkbox"> VPL を表示</label>
<label><input id="anim" type="checkbox" checked> ライトを動かす</label>
<div id="stat"></div></div><div id="tagL">クリーン（直接光のみ）</div><div id="tagR">PS1＋フェイクバウンス</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:false});R.setPixelRatio(1);R.setSize(innerWidth,innerHeight);R.autoClear=true;document.body.append(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x000000);
const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.05,60);cam.position.set(0,1.6,8.2);
const ctl=new OrbitControls(cam,R.domElement);ctl.target.set(0,1.3,0);ctl.enableDamping=true;ctl.minDistance=1;ctl.maxDistance=9;ctl.update();
// ---- procedural textures
function tex(draw,n=64){const c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d',{willReadFrequently:true});draw(g,n);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.generateMipmaps=true;t.minFilter=THREE.LinearMipmapLinearFilter;return t}
const noise=(g,n,a)=>{for(let i=0;i<n*n/3;i++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},0,${a*Math.random()})`;g.fillRect(Math.random()*n|0,Math.random()*n|0,1,1)}};
const T={
 brick:tex((g,n)=>{g.fillStyle='#7a5a48';g.fillRect(0,0,n,n);g.fillStyle='#a07258';for(let y=0;y<8;y++)for(let x=-1;x<4;x++)g.fillRect(x*16+(y%2)*8+1,y*8+1,14,6);noise(g,n,.15)}),
 floor:tex((g,n)=>{for(let y=0;y<2;y++)for(let x=0;x<2;x++){g.fillStyle=(x+y)%2?'#6d6a63':'#8b867b';g.fillRect(x*32,y*32,32,32)}g.strokeStyle='#3c3a36';g.strokeRect(0,0,n,n);noise(g,n,.2)}),
 wood:tex((g,n)=>{g.fillStyle='#8a5d33';g.fillRect(0,0,n,n);g.fillStyle='#5f3d1f';for(let i=0;i<n;i+=16)g.fillRect(0,i,n,2);g.fillRect(0,0,3,n);g.fillRect(n-3,0,3,n);g.fillRect(0,0,n,3);g.fillRect(0,n-3,n,3);noise(g,n,.15)}),
 plaster:tex((g,n)=>{g.fillStyle='#c8c0ae';g.fillRect(0,0,n,n);noise(g,n,.12)}),
 red:tex((g,n)=>{g.fillStyle='#b23a2e';g.fillRect(0,0,n,n);g.fillStyle='#d8b35a';g.fillRect(0,28,n,8);noise(g,n,.1)}),
 teal:tex((g,n)=>{g.fillStyle='#2f8a86';g.fillRect(0,0,n,n);g.fillStyle='#e4e0d0';for(let i=0;i<n;i+=16)g.fillRect(i,0,6,n);noise(g,n,.1)}),
};
// ---- shared uniforms
const NV=48,NL=2;
const U={uPS1:{value:1},uAff:{value:1},uGour:{value:1},uSnap:{value:160},uBounce:{value:1},uRes:{value:new THREE.Vector2(320,240)},
 uLP:{value:[new THREE.Vector3(),new THREE.Vector3()]},uLC:{value:[new THREE.Color(),new THREE.Color()]},
 uVP:{value:Array.from({length:NV},()=>new THREE.Vector3())},uVN:{value:Array.from({length:NV},()=>new THREE.Vector3())},uVC:{value:Array.from({length:NV},()=>new THREE.Vector3())},uNV:{value:0},uAmb:{value:new THREE.Color(0x0a0b10)}};
const LIGHT=`uniform vec3 uLP[${NL}];uniform vec3 uLC[${NL}];uniform vec3 uVP[${NV}];uniform vec3 uVN[${NV}];uniform vec3 uVC[${NV}];uniform int uNV;uniform float uBounce;uniform vec3 uAmb;
vec3 lightAt(vec3 p,vec3 n,float useB){vec3 c=uAmb;for(int i=0;i<${NL};i++){vec3 L=uLP[i]-p;float d=length(L);c+=uLC[i]*max(dot(n,L/d),0.)/(1.+.35*d*d);}
 if(useB>0.){vec3 b=vec3(0);for(int j=0;j<${NV};j++){if(j>=uNV)break;vec3 L=uVP[j]-p;float d2=dot(L,L)+.25;vec3 l=L*inversesqrt(d2);b+=uVC[j]*max(dot(n,l),0.)*max(dot(uVN[j],-l),0.)/d2;}c+=b*uBounce*useB;}return c;}`;
const VS=`uniform float uPS1,uAff,uGour,uSnap;uniform vec2 uRes;uniform float uUseB;${LIGHT}
varying vec2 vUv;varying vec2 vUvW;varying float vW;varying vec3 vP;varying vec3 vN;varying vec3 vG;uniform vec2 uRep;
void main(){vec4 wp=modelMatrix*vec4(position,1.);vP=wp.xyz;vN=normalize(mat3(modelMatrix)*normal);vUv=uv*uRep;
 vec4 cp=projectionMatrix*viewMatrix*wp;
 if(uPS1>.5){vec2 g=vec2(uSnap*uRes.x/uRes.y,uSnap)*.5;cp.xy=floor(cp.xy/cp.w*g+.5)/g*cp.w;}
 vUvW=vUv*cp.w;vW=cp.w;vG=uGour>.5&&uPS1>.5?lightAt(vP,vN,uUseB):vec3(0);gl_Position=cp;}`;
const FS=`uniform float uPS1,uAff,uGour;uniform sampler2D map;uniform vec2 uTS;uniform vec3 uEmi;uniform float uUseB;${LIGHT}
varying vec2 vUv;varying vec2 vUvW;varying float vW;varying vec3 vP;varying vec3 vN;varying vec3 vG;
void main(){vec2 uv=vUv;if(uPS1>.5){if(uAff>.5)uv=vUvW/vW;uv=(floor(uv*uTS)+.5)/uTS;}
 vec3 alb=texture2D(map,uv).rgb;vec3 lit=(uPS1>.5&&uGour>.5)?vG:lightAt(vP,normalize(vN),uUseB);
 gl_FragColor=vec4(alb*lit+uEmi,1.);}`;
const mats=[];
function M(t,rep=[1,1],emi=0){const m=new THREE.ShaderMaterial({uniforms:{...U,map:{value:t},uTS:{value:new THREE.Vector2(64,64)},uRep:{value:new THREE.Vector2(...rep)},uEmi:{value:new THREE.Color(emi)},uUseB:{value:1}},vertexShader:VS,fragmentShader:FS});mats.push(m);return m}
// average albedo per texture (for bounce color)
function avg(t){const g=t.image.getContext('2d').getImageData(0,0,64,64).data;const c=[0,0,0];for(let i=0;i<g.length;i+=4){c[0]+=g[i];c[1]+=g[i+1];c[2]+=g[i+2]}return new THREE.Color().setRGB(...c.map(v=>v/(g.length/4)/255),THREE.SRGBColorSpace)}
const solids=[];
function add(geo,t,rep,pos,rot=[0,0,0],emi=0){const m=new THREE.Mesh(geo,M(t,rep,emi));m.position.set(...pos);m.rotation.set(...rot);m.userData.alb=avg(t);S.add(m);solids.push(m);return m}
// corridor: 6w x 3.2h x 18d, tessellated so vertex lighting/snap reads
const W=6,H=3.2,D=18;
add(new THREE.PlaneGeometry(W,D,8,24),T.floor,[3,9],[0,0,0],[-Math.PI/2,0,0]);
add(new THREE.PlaneGeometry(W,D,8,24),T.plaster,[3,9],[0,H,0],[Math.PI/2,0,0]);
add(new THREE.PlaneGeometry(D,H,24,5),T.brick,[6,1.2],[-W/2,H/2,0],[0,Math.PI/2,0]);
add(new THREE.PlaneGeometry(D,H,24,5),T.brick,[6,1.2],[W/2,H/2,0],[0,-Math.PI/2,0]);
add(new THREE.PlaneGeometry(W,H,8,5),T.red,[1,1],[0,H/2,-D/2],[0,0,0]);
add(new THREE.PlaneGeometry(W,H,8,5),T.teal,[2,1],[0,H/2,D/2],[0,Math.PI,0]);
for(const [x,z,s] of [[-1.8,-2,.9],[-1.6,-.9,.6],[2,2.5,1],[1.9,1.2,.5]])add(new THREE.BoxGeometry(s,s,s,2,2,2),T.wood,[1,1],[x,s/2,z],[0,x*.3,0]);
add(new THREE.CylinderGeometry(.35,.35,H,10,4),T.plaster,[2,2],[-2.2,H/2,-5.5]);add(new THREE.CylinderGeometry(.35,.35,H,10,4),T.plaster,[2,2],[2.2,H/2,6]);
add(new THREE.CylinderGeometry(.4,.4,1,12,2),T.red,[2,1],[-2.2,.5,4]);
add(new THREE.IcosahedronGeometry(.6,1),T.teal,[1,1],[1.6,.6,-3.6]);
add(new THREE.BoxGeometry(2.2,.12,.12),T.wood,[2,1],[0,2.4,-8.9]);
// light markers (emissive, not in raycast)
const lightCols=[new THREE.Color(1.0,.62,.3).multiplyScalar(4.2),new THREE.Color(.35,.75,1).multiplyScalar(3.2)];
const marks=lightCols.map(c=>{const m=new THREE.Mesh(new THREE.OctahedronGeometry(.12),new THREE.MeshBasicMaterial({color:c.clone().multiplyScalar(.3)}));S.add(m);return m});
const vplGroup=new THREE.Group();S.add(vplGroup);const vplDots=[];for(let i=0;i<NV;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.05,6,4),new THREE.MeshBasicMaterial({color:0xffffff}));vplGroup.add(d);vplDots.push(d)}
// fibonacci directions per light
const DIRS=[];const per=NV/NL;for(let i=0;i<per;i++){const y=1-2*(i+.5)/per,r=Math.sqrt(1-y*y),a=i*2.39996;DIRS.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r))}
const ray=new THREE.Raycaster();ray.far=30;
function updateLights(t){const P=[new THREE.Vector3(-1.2+Math.sin(t*.5)*1.1,2.2,-4+Math.sin(t*.31)*3.5),new THREE.Vector3(1.6,1.2+Math.sin(t*.7)*.6,3+Math.cos(t*.4)*2.5)];
 const fl=1+.06*Math.sin(t*23)*Math.sin(t*7.1);
 let k=0;P.forEach((p,i)=>{U.uLP.value[i].copy(p);const lc=lightCols[i].clone().multiplyScalar(i===0?fl:1);U.uLC.value[i].copy(lc);marks[i].position.copy(p);
  for(const d of DIRS){ray.set(p,d);const h=ray.intersectObjects(solids,false)[0];if(!h)continue;
   const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);
   const lam=Math.max(n.dot(d.clone().negate()),0)/(1+.35*h.distance*h.distance);
   const a=h.object.userData.alb;const flux=4*Math.PI/per*1.6;// 光束を等分
   U.uVP.value[k].copy(h.point).addScaledVector(n,.05);U.uVN.value[k].copy(n);U.uVC.value[k].set(lc.r*a.r*lam*flux,lc.g*a.g*lam*flux,lc.b*a.b*lam*flux);
   vplDots[k].position.copy(U.uVP.value[k]);vplDots[k].material.color.setRGB(Math.min(1,a.r*1.2),Math.min(1,a.g*1.2),Math.min(1,a.b*1.2));k++}});
 U.uNV.value=k;}
// ---- render targets + composite
let rtLow,rtClean;
function makeRT(){const h=+$('res').value,w=Math.round(h*innerWidth/innerHeight);rtLow?.dispose();rtClean?.dispose();
 rtLow=new THREE.WebGLRenderTarget(w,h,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,type:THREE.HalfFloatType});
 rtClean=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,samples:4});U.uRes.value.set(w,h)}
const post=new THREE.ShaderMaterial({uniforms:{tLow:{value:null},tClean:{value:null},uSplit:{value:.5},uMode:{value:0},uDith:{value:1},uLowRes:{value:new THREE.Vector2()}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
 fragmentShader:`uniform sampler2D tLow,tClean;uniform float uSplit,uMode,uDith;uniform vec2 uLowRes;varying vec2 vUv;
 float bayer(vec2 p){ivec2 q=ivec2(mod(p,4.));int m[16]=int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);return float(m[q.y*4+q.x])/16.-.5;}
 vec3 tm(vec3 c){c=c/(1.+c*.6);return pow(clamp(c,0.,1.),vec3(1./2.2));}
 void main(){bool low=uMode>.5;if(uMode>1.5)low=vUv.x>uSplit;vec3 c;
  if(low){c=tm(texture2D(tLow,vUv).rgb);if(uDith>.5){vec2 px=floor(vUv*uLowRes);c=floor(c*31.+bayer(px)+.5)/31.;}}else c=tm(texture2D(tClean,vUv).rgb);
  if(uMode>1.5&&abs(vUv.x-uSplit)<.0015)c=vec3(1.);gl_FragColor=vec4(c,1.);}`});
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),post);const PS=new THREE.Scene();PS.add(quad);const PC=new THREE.Camera();
let mode='ps1b';
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));
 $('tagL').style.display=$('tagR').style.display=mode==='ab'?'block':'none'});
$('res').oninput=()=>{$('rv').textContent=$('res').value;makeRT()};$('snap').oninput=()=>$('sv').textContent=$('snap').value;$('bounce').oninput=()=>$('bv').textContent=$('bounce').value;
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);makeRT()};makeRT();
function setPass(ps1,useB){U.uPS1.value=ps1;for(const m of mats)m.uniforms.uUseB.value=useB}
const clk=new THREE.Clock();let t=0,fr=0,acc=0;
R.setAnimationLoop(()=>{const dt=clk.getDelta();if($('anim').checked)t+=dt;updateLights(t);ctl.update();
 U.uAff.value=$('aff').checked?1:0;U.uGour.value=$('gour').checked?1:0;U.uSnap.value=+$('snap').value;U.uBounce.value=+$('bounce').value;
 vplGroup.visible=$('showv').checked;
 const needLow=mode!=='clean',needClean=mode==='clean'||mode==='ab';
 if(needLow){setPass(1,mode==='ps1'?0:1);R.setRenderTarget(rtLow);R.render(S,cam)}
 if(needClean){setPass(0,0);R.setRenderTarget(rtClean);R.render(S,cam)}
 post.uniforms.tLow.value=rtLow.texture;post.uniforms.tClean.value=rtClean.texture;post.uniforms.uMode.value=mode==='clean'?0:mode==='ab'?2:1;
 post.uniforms.uSplit.value=+$('split').value;post.uniforms.uDith.value=$('dith').checked?1:0;post.uniforms.uLowRes.value.copy(U.uRes.value);
 R.setRenderTarget(null);R.render(PS,PC);
 acc+=dt;if(++fr%20===0){$('stat').textContent=`VPL ${U.uNV.value} 個 / 内部 ${U.uRes.value.x}×${U.uRes.value.y} / ${(20/acc).toFixed(0)} fps`;acc=0}});
</script></body></html>
