<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>mini grass walk — bookmark prototype</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#e8eefc;font:14px/1.4 system-ui}
  #hud{position:fixed;left:12px;top:12px;z-index:2;background:rgba(0,0,0,.45);padding:10px 12px;border-radius:8px;max-width:320px}
  canvas{display:block}
</style>
</head>
<body>
<div id="hud">
  <b>mini grass walk</b>（今日の Three.js ブックマークの超軽量再現）<br/>
  WASD / 矢印で移動。BELENUSやWebデモ用の「地面の存在感」実験。
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87a0c0, 8, 40);
scene.background = new THREE.Color(0x87a0c0);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 6);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff, 0x445566, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 0.85);
sun.position.set(5, 12, 3);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80, 128, 128),
  new THREE.MeshStandardMaterial({color:0x3d7a3a, flatShading:true})
);
ground.rotation.x = -Math.PI/2;
const pos = ground.geometry.attributes.position;
for (let i=0;i<pos.count;i++){
  const x=pos.getX(i), y=pos.getY(i);
  pos.setZ(i, Math.sin(x*0.35)*0.15 + Math.cos(y*0.4)*0.12 + (Math.random()-0.5)*0.05);
}
pos.needsUpdate = true;
ground.geometry.computeVertexNormals();
scene.add(ground);

// simple blade instances
const bladeGeo = new THREE.ConeGeometry(0.03, 0.45, 3);
const bladeMat = new THREE.MeshStandardMaterial({color:0x4caf50, flatShading:true});
const blades = new THREE.InstancedMesh(bladeGeo, bladeMat, 1200);
const dummy = new THREE.Object3D();
for (let i=0;i<1200;i++){
  const x=(Math.random()-0.5)*40, z=(Math.random()-0.5)*40;
  dummy.position.set(x, 0.2, z);
  dummy.rotation.y = Math.random()*Math.PI;
  dummy.scale.set(1, 0.7+Math.random()*0.8, 1);
  dummy.updateMatrix();
  blades.setMatrixAt(i, dummy.matrix);
}
scene.add(blades);

const keys = {};
addEventListener('keydown', e => keys[e.code]=true);
addEventListener('keyup', e => keys[e.code]=false);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const vel = new THREE.Vector3();
function tick(t){
  requestAnimationFrame(tick);
  const forward = (keys.KeyW||keys.ArrowUp)?1:0;
  const back = (keys.KeyS||keys.ArrowDown)?1:0;
  const left = (keys.KeyA||keys.ArrowLeft)?1:0;
  const right = (keys.KeyD||keys.ArrowRight)?1:0;
  vel.set(right-left, 0, back-forward).normalize().multiplyScalar(0.08);
  camera.position.add(vel);
  camera.position.y = 1.6;
  blades.rotation.y = Math.sin(t*0.001)*0.01;
  renderer.render(scene, camera);
}
tick(0);
</script>
</body>
</html>
